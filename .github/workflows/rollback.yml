name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      image_tag:
        description: 'Image tag to roll back to (previous known-good git short-sha)'
        required: true

jobs:
  rollback-dev:
    if: github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, dev]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull and redeploy previous tag
        run: |
          docker pull pavielex/wasapache:${{ github.event.inputs.image_tag }}
          docker pull pavielex/wasmaven:${{ github.event.inputs.image_tag }}
          export IMAGE_TAG=${{ github.event.inputs.image_tag }}
          docker-compose down
          docker-compose up -d
      - run: echo "Rolled back DEV to ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

  rollback-qa:
    if: github.event.inputs.environment == 'qa'
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, qa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull and redeploy previous tag
        run: |
          docker pull pavielex/wasapache:${{ github.event.inputs.image_tag }}
          docker pull pavielex/wasmaven:${{ github.event.inputs.image_tag }}
          export IMAGE_TAG=${{ github.event.inputs.image_tag }}
          docker-compose down
          docker-compose up -d
      - run: echo "Rolled back QA to ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

  rollback-prod:
    if: github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, prod]
    environment: prod   # required reviewer approval applies to rollback too
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull and redeploy previous tag
        run: |
          docker pull pavielex/wasapache:${{ github.event.inputs.image_tag }}
          docker pull pavielex/wasmaven:${{ github.event.inputs.image_tag }}
          export IMAGE_TAG=${{ github.event.inputs.image_tag }}
          docker-compose down
          docker-compose up -d
      - run: echo "Rolled back PROD to ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
