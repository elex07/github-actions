name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type yes to confirm dev deployment'
        required: true
        default: 'yes'

jobs:
  build-and-deploy:
    #runs-on: ubuntu-latest
# Below attribute will deploy on respective server
    runs-on: [self-hosted, dev]

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set image tag (short git sha)
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build apache image
        run: docker build -t pavielex/wasapache:${{ env.IMAGE_TAG }} ./apache

      - name: Build maven image
        run: docker build -t pavielex/wasmaven:${{ env.IMAGE_TAG }} ./maven

      - name: Push images to Docker Hub
        run: |
          docker push pavielex/wasapache:${{ env.IMAGE_TAG }}
          docker push pavielex/wasmaven:${{ env.IMAGE_TAG }}

      - name: Also tag as dev-latest for visibility
        run: |
          docker tag pavielex/wasapache:${{ env.IMAGE_TAG }} pavielex/wasapache:dev-latest
          docker tag pavielex/wasmaven:${{ env.IMAGE_TAG }} pavielex/wasmaven:dev-latest
          docker push pavielex/wasapache:dev-latest
          docker push pavielex/wasmaven:dev-latest

      - name: Deploy with docker-compose
        run: |
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker-compose down
          docker-compose up -d

      - name: Clean up dangling images
        run: docker image prune -f

      - name: Print deployed version
        run: |
          echo "### Deployed to DEV" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: $(git rev-parse HEAD)" >> $GITHUB_STEP_SUMMARY
