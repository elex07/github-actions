name: Deploy to QA

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote to QA (the git short-sha shown in the Deploy to Dev summary, or dev-latest)'
        required: true
        default: 'dev-latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
# Below attribute will deploy on respective server
    #runs-on: [self-hosted, qa]

    steps:
      - name: Checkout qa branch
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull requested images (no build)
        run: |
          docker pull pavielex/wasapache:${{ github.event.inputs.image_tag }}
          docker pull pavielex/wasmaven:${{ github.event.inputs.image_tag }}

      - name: Deploy with docker-compose
        run: |
          export IMAGE_TAG=${{ github.event.inputs.image_tag }}
          docker-compose down
          docker-compose up -d

      - name: Also tag as qa-latest for visibility
        run: |
          docker tag pavielex/wasapache:${{ github.event.inputs.image_tag }} pavielex/wasapache:qa-latest
          docker tag pavielex/wasmaven:${{ github.event.inputs.image_tag }} pavielex/wasmaven:qa-latest
          docker push pavielex/wasapache:qa-latest
          docker push pavielex/wasmaven:qa-latest

      - name: Clean up dangling images
        run: docker image prune -f

      - name: Print deployed version
        run: |
          echo "### Deployed to QA" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
