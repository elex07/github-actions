name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote to Prod (the git short-sha that passed QA, or qa-latest)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
# Below attribute will deploy on respective server
    #runs-on: [self-hosted, prod]
    environment: prod   # configure required reviewers on this environment in repo Settings

    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull requested images (no build)
        run: |
          docker pull pavielex/wasapache:${{ github.event.inputs.image_tag }}
          docker pull pavielex/wasmaven:${{ github.event.inputs.image_tag }}

      - name: Deploy with docker-compose
        run: |
          export IMAGE_TAG=${{ github.event.inputs.image_tag }}
          docker-compose down
          docker-compose up -d

      - name: Also tag as prod-latest for visibility
        run: |
          docker tag pavielex/wasapache:${{ github.event.inputs.image_tag }} pavielex/wasapache:prod-latest
          docker tag pavielex/wasmaven:${{ github.event.inputs.image_tag }} pavielex/wasmaven:prod-latest
          docker push pavielex/wasapache:prod-latest
          docker push pavielex/wasmaven:prod-latest

      - name: Clean up dangling images
        run: docker image prune -f

      - name: Print deployed version
        run: |
          echo "### Deployed to PROD" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
